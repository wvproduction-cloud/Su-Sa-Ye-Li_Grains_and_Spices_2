<!DOCTYPE html><html lang="si"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Su-Sa-Ye-Li</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/lang.css"><link rel="stylesheet" href="assets/settings.css"></head><body class="bg-stone-50 min-h-screen"><div class="min-h-screen grid lg:grid-cols-2"><div class="hidden lg:flex bg-stone-900 text-white p-14 items-end relative overflow-hidden"><div class="absolute inset-0 opacity-30 bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:18px_18px]"></div><div class="relative z-10"><div class="flex items-center gap-3 mb-8"><div class="site-logo-icon bg-amber-700 p-3 rounded-xl"><i class="fa-solid fa-seedling text-xl"></i></div><div><b class="text-xl">Su-Sa-Ye-Li</b><span class="block text-xs text-amber-400">Grains & Spices</span></div></div><h1 class="text-5xl font-extrabold leading-tight">Admin<br><span class="text-amber-400">Control Center</span></h1><p class="text-stone-300 mt-5 max-w-md">Manage products, prices, images, and your catalog from one place.</p></div></div><div class="flex items-center justify-center p-6"><div class="w-full max-w-md bg-white rounded-3xl border border-stone-200 shadow-2xl p-8"><a href="index.html" class="text-xs text-stone-500 hover:text-amber-700"><i class="fa-solid fa-arrow-left"></i> Back to website</a><div class="mt-8 mb-7"><div class="w-14 h-14 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center text-xl mb-5"><i class="fa-solid fa-lock"></i></div><h2 class="text-3xl font-extrabold text-stone-900">Admin Login</h2><p class="text-sm text-stone-500 mt-2">Sign in to access the admin dashboard.</p></div><form id="loginForm" class="space-y-4"><div><label class="block text-xs font-bold uppercase text-stone-700 mb-1">Username</label><input id="username" autocomplete="username" required class="w-full px-4 py-3 rounded-xl border border-stone-300 outline-none focus:ring-2 focus:ring-amber-600" value="admin"></div><div><label class="block text-xs font-bold uppercase text-stone-700 mb-1">Password</label><div class="relative"><input id="password" type="password" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl border border-stone-300 outline-none focus:ring-2 focus:ring-amber-600 pr-12"><button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-stone-400"><i class="fa-solid fa-eye"></i></button></div></div><p id="loginError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2"></p><button class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3.5 rounded-xl shadow-lg">Login <i class="fa-solid fa-arrow-right ml-1"></i></button></form><div class="mt-6 text-xs text-stone-500 bg-stone-50 rounded-xl p-3"><b>Demo login:</b> admin / SusaYeLi@2026</div></div></div></div><script>

</script><script src="assets/lang.js"></script><script src="assets/page-images.js"></script><button type="button" class="global-lang-btn" id="globalLangBtn" onclick="togglePageLanguage()">English</button><script src="assets/settings.js"></script></body></html>
